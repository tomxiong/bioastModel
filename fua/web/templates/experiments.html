{% extends "index.html" %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>实验管理</h2>
        <div>
            <button class="btn btn-primary" onclick="refreshExperiments()">
                <i class="fas fa-sync-alt"></i> 刷新
            </button>
            <button class="btn btn-info" id="compare-selected-btn" onclick="compareSelectedExperiments()" disabled>
                <i class="fas fa-balance-scale"></i> 比较选中 (0)
            </button>
            <button class="btn btn-success" onclick="createNewExperiment()">
                <i class="fas fa-plus"></i> 新建实验
            </button>
        </div>
    </div>
    
    <!-- Filters -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row">
                <div class="col-md-3">
                    <label class="form-label">状态</label>
                    <select class="form-select" id="status-filter" onchange="filterExperiments()">
                        <option value="">全部状态</option>
                        <option value="RUNNING">运行中</option>
                        <option value="FINISHED">已完成</option>
                        <option value="FAILED">失败</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">时间范围</label>
                    <select class="form-select" id="date-filter" onchange="filterExperiments()">
                        <option value="">全部时间</option>
                        <option value="today">今天</option>
                        <option value="week">最近7天</option>
                        <option value="month">最近30天</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">排序方式</label>
                    <select class="form-select" id="sort-filter" onchange="filterExperiments()">
                        <option value="start_time">开始时间</option>
                        <option value="run_name">名称</option>
                        <option value="status">状态</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">搜索</label>
                    <input type="text" class="form-control" id="search-input" placeholder="搜索实验..." onkeyup="filterExperiments()">
                </div>
            </div>
        </div>
    </div>
    
    <!-- Experiments Table -->
    <div class="card experiment-table">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Run ID</th>
                            <th>Run Name</th>
                            <th>Status</th>
                            <th>Start Time</th>
                            <th>End Time</th>
                            <th>Duration</th>
                            <th>Best Metric</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="experiments-table">
                        <tr>
                            <td colspan="8" class="text-center">
                                <div class="loading-spinner"></div>
                                <p class="text-muted mt-2">加载实验中...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <!-- Pagination -->
    <nav aria-label="Experiments pagination">
        <ul class="pagination justify-content-center" id="pagination">
            <!-- Pagination will be dynamically generated -->
        </ul>
    </nav>
</div>

<!-- Experiment Details Modal -->
<div class="modal fade" id="experimentModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">实验详情</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="experiment-details">
                <!-- Details will be loaded dynamically -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                <button type="button" class="btn btn-primary" onclick="exportExperimentResults()">导出结果</button>
            </div>
        </div>
    </div>
</div>

<!-- New Experiment Modal -->
<div class="modal fade" id="newExperimentModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Create New Experiment</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="new-experiment-form">
                    <div class="mb-3">
                        <label class="form-label">Experiment Name</label>
                        <input type="text" class="form-control" id="experiment-name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Model Type</label>
                        <select class="form-select" id="model-type" required>
                            <option value="">Select Model...</option>
                            <option value="mobilenetv3">MobileNetV3</option>
                            <option value="resnet">ResNet</option>
                            <option value="efficientnet">EfficientNet</option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Learning Rate</label>
                                <input type="number" class="form-control" id="learning-rate" step="0.0001" value="0.001" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Batch Size</label>
                                <input type="number" class="form-control" id="batch-size" value="32" required>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Epochs</label>
                        <input type="number" class="form-control" id="epochs" value="50" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" id="experiment-description" rows="3"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="submitNewExperiment()">Create Experiment</button>
            </div>
        </div>
    </div>
</div>

<script>
let experimentsData = [];
let filteredExperiments = [];

// Load experiments on page load
document.addEventListener('DOMContentLoaded', function() {
    loadExperiments();
});

// Load experiments from API
async function loadExperiments() {
    try {
        const response = await fetch('/api/experiments');
        const data = await response.json();
        experimentsData = data.experiments || [];
        filteredExperiments = [...experimentsData];
        renderExperimentsTable();
    } catch (error) {
        console.error('Failed to load experiments:', error);
        showAlert('Failed to load experiments', 'danger');
    }
}

// Render experiments table
function renderExperimentsTable() {
    const tbody = document.getElementById('experiments-table');
    
    if (filteredExperiments.length === 0) {
        tbody.innerHTML = `
            <tr>
                <td colspan="8" class="text-center text-muted">No experiments found</td>
            </tr>
        `;
        return;
    }
    
    tbody.innerHTML = filteredExperiments.map(exp => {
        const duration = exp.end_time && exp.start_time ? 
            calculateDuration(new Date(exp.start_time), new Date(exp.end_time)) : 
            exp.status === 'RUNNING' ? calculateDuration(new Date(exp.start_time), new Date()) : 'N/A';
        
        const bestMetric = getBestMetric(exp.metrics);
        
        return `
            <tr data-run-id="${exp.run_id}">
                <td><code>${exp.run_id.substring(0, 8)}</code></td>
                <td>${exp.run_name || '未命名'}</td>
                <td><span class="badge bg-${getStatusColor(exp.status)}">${exp.status}</span></td>
                <td>${exp.start_time ? formatDateTime(exp.start_time) : 'N/A'}</td>
                <td>${exp.end_time ? formatDateTime(exp.end_time) : '-'}</td>
                <td>${duration}</td>
                <td>${bestMetric}</td>
                <td>
                    <div class="btn-group" role="group">
                        <button class="btn btn-sm btn-outline-primary" onclick="viewExperimentDetails('${exp.run_id}')" title="查看详情">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-success" onclick="compareExperiment('${exp.run_id}')" title="比较">
                            <i class="fas fa-balance-scale"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteExperiment('${exp.run_id}')" title="删除">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </td>
            </tr>
        `;
    }).join('');
    
    updatePagination();
}

// Filter experiments
function filterExperiments() {
    const statusFilter = document.getElementById('status-filter').value;
    const dateFilter = document.getElementById('date-filter').value;
    const sortFilter = document.getElementById('sort-filter').value;
    const searchInput = document.getElementById('search-input').value.toLowerCase();
    
    filteredExperiments = experimentsData.filter(exp => {
        // Status filter
        if (statusFilter && exp.status !== statusFilter) return false;
        
        // Date filter
        if (dateFilter) {
            const expDate = new Date(exp.start_time);
            const now = new Date();
            const daysDiff = (now - expDate) / (1000 * 60 * 60 * 24);
            
            switch (dateFilter) {
                case 'today':
                    if (daysDiff > 1) return false;
                    break;
                case 'week':
                    if (daysDiff > 7) return false;
                    break;
                case 'month':
                    if (daysDiff > 30) return false;
                    break;
            }
        }
        
        // Search filter
        if (searchInput && !exp.run_name?.toLowerCase().includes(searchInput)) {
            return false;
        }
        
        return true;
    });
    
    // Sort experiments
    filteredExperiments.sort((a, b) => {
        switch (sortFilter) {
            case 'start_time':
                return new Date(b.start_time) - new Date(a.start_time);
            case 'run_name':
                return (a.run_name || '').localeCompare(b.run_name || '');
            case 'status':
                return a.status.localeCompare(b.status);
            default:
                return 0;
        }
    });
    
    renderExperimentsTable();
}

// Refresh experiments
function refreshExperiments() {
    loadExperiments();
    showAlert('Experiments refreshed', 'success');
}

// Create new experiment
function createNewExperiment() {
    const modal = new bootstrap.Modal(document.getElementById('newExperimentModal'));
    modal.show();
}

// Submit new experiment
async function submitNewExperiment() {
    const form = document.getElementById('new-experiment-form');
    if (!form.checkValidity()) {
        form.reportValidity();
        return;
    }
    
    const experimentData = {
        name: document.getElementById('experiment-name').value,
        model_type: document.getElementById('model-type').value,
        learning_rate: parseFloat(document.getElementById('learning-rate').value),
        batch_size: parseInt(document.getElementById('batch-size').value),
        epochs: parseInt(document.getElementById('epochs').value),
        description: document.getElementById('experiment-description').value
    };
    
    try {
        const response = await fetch('/api/experiments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(experimentData)
        });
        
        const result = await response.json();
        
        if (response.ok) {
            showAlert('实验创建成功', 'success');
            bootstrap.Modal.getInstance(document.getElementById('newExperimentModal')).hide();
            loadExperiments();
        } else {
            showAlert(`创建失败: ${result.error}`, 'danger');
        }
    } catch (error) {
        console.error('Failed to create experiment:', error);
        showAlert('创建实验失败', 'danger');
    }
}

// View experiment details
async function viewExperimentDetails(runId) {
    try {
        // Fetch detailed experiment data
        const response = await fetch(`/api/experiments/${runId}`);
        const experiment = await response.json();
        
        if (!response.ok) {
            showAlert(`加载失败: ${experiment.error}`, 'danger');
            return;
        }
        
        const detailsHtml = `
            <div class="row">
                <div class="col-md-6">
                    <h6>实验信息</h6>
                    <table class="table table-sm">
                        <tr><td><strong>Run ID:</strong></td><td><code>${experiment.run_id}</code></td></tr>
                        <tr><td><strong>名称:</strong></td><td>${experiment.run_name || 'N/A'}</td></tr>
                        <tr><td><strong>状态:</strong></td><td><span class="badge bg-${getStatusColor(experiment.status)}">${experiment.status}</span></td></tr>
                        <tr><td><strong>开始时间:</strong></td><td>${formatDateTime(experiment.start_time)}</td></tr>
                        <tr><td><strong>结束时间:</strong></td><td>${experiment.end_time ? formatDateTime(experiment.end_time) : 'N/A'}</td></tr>
                    </table>
                </div>
                <div class="col-md-6">
                    <h6>参数</h6>
                    <div class="table-responsive">
                        <table class="table table-sm">
                            ${formatParams(experiment.params)}
                        </table>
                    </div>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-12">
                    <h6>指标</h6>
                    <div class="row">
                        ${formatMetricsCards(experiment.metrics)}
                    </div>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-12">
                    <h6>性能图表</h6>
                    <canvas id="metrics-chart" height="200"></canvas>
                </div>
            </div>
            ${experiment.tags && Object.keys(experiment.tags).length > 0 ? `
            <div class="row mt-3">
                <div class="col-12">
                    <h6>标签</h6>
                    <div>
                        ${Object.entries(experiment.tags).map(([key, value]) => 
                            `<span class="badge bg-secondary me-1">${key}: ${value}</span>`
                        ).join('')}
                    </div>
                </div>
            </div>
            ` : ''}
        `;
        
        document.getElementById('experiment-details').innerHTML = detailsHtml;
        
        const modal = new bootstrap.Modal(document.getElementById('experimentModal'));
        modal.show();
        
        // Initialize metrics chart
        setTimeout(() => initializeMetricsChart(experiment.metrics), 500);
        
    } catch (error) {
        console.error('Failed to view experiment details:', error);
        showAlert('加载实验详情失败', 'danger');
    }
}

// Utility functions
function getStatusColor(status) {
    switch (status) {
        case 'FINISHED': return 'success';
        case 'RUNNING': return 'primary';
        case 'FAILED': return 'danger';
        default: return 'secondary';
    }
}

function formatDateTime(dateString) {
    return new Date(dateString).toLocaleString();
}

function calculateDuration(start, end) {
    const diff = end - start;
    const hours = Math.floor(diff / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    return `${hours}h ${minutes}m`;
}

function getBestMetric(metrics) {
    if (!metrics) return 'N/A';
    
    // Look for common metrics
    const priorities = ['val_acc', 'accuracy', 'acc', 'f1', 'auc'];
    for (const metric of priorities) {
        if (metrics[metric] !== undefined) {
            return `${metric}: ${typeof metrics[metric] === 'number' ? metrics[metric].toFixed(3) : metrics[metric]}`;
        }
    }
    
    // Return first numeric metric
    for (const [key, value] of Object.entries(metrics)) {
        if (typeof value === 'number') {
            return `${key}: ${value.toFixed(3)}`;
        }
    }
    
    return 'N/A';
}

function formatParams(params) {
    if (!params) return '<tr><td colspan="2">No parameters</td></tr>';
    
    return Object.entries(params).map(([key, value]) => {
        let displayValue = value;
        try {
            // Try to parse JSON values
            const parsed = JSON.parse(value);
            displayValue = typeof parsed === 'object' ? JSON.stringify(parsed, null, 2) : parsed;
        } catch (e) {
            // Use as is if not JSON
        }
        return `<tr><td><strong>${key}:</strong></td><td>${displayValue}</td></tr>`;
    }).join('');
}

function formatMetricsCards(metrics) {
    if (!metrics) return '<div class="col-12"><p class="text-muted">No metrics available</p></div>';
    
    return Object.entries(metrics).map(([key, value]) => `
        <div class="col-md-3 mb-2">
            <div class="card text-center">
                <div class="card-body">
                    <h6 class="card-title">${key}</h6>
                    <p class="card-text mb-0">${typeof value === 'number' ? value.toFixed(4) : value}</p>
                </div>
            </div>
        </div>
    `).join('');
}

function initializeMetricsChart(metrics) {
    const canvas = document.getElementById('metrics-chart');
    if (!canvas || !metrics) return;
    
    // Extract numeric metrics that could be charted
    const chartData = Object.entries(metrics)
        .filter(([key, value]) => typeof value === 'number')
        .map(([key, value]) => ({ label: key, value: value }))
        .slice(0, 10); // Limit to 10 metrics
    
    new Chart(canvas, {
        type: 'bar',
        data: {
            labels: chartData.map(d => d.label),
            datasets: [{
                label: 'Metric Values',
                data: chartData.map(d => d.value),
                backgroundColor: 'rgba(54, 162, 235, 0.5)',
                borderColor: 'rgba(54, 162, 235, 1)',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
}

function updatePagination() {
    // Simple pagination - could be enhanced
    const totalPages = Math.ceil(filteredExperiments.length / 10);
    const pagination = document.getElementById('pagination');
    
    if (totalPages <= 1) {
        pagination.innerHTML = '';
        return;
    }
    
    let html = '';
    for (let i = 1; i <= totalPages; i++) {
        html += `
            <li class="page-item ${i === 1 ? 'active' : ''}">
                <a class="page-link" href="#" onclick="goToPage(${i})">${i}</a>
            </li>
        `;
    }
    
    pagination.innerHTML = html;
}

function goToPage(page) {
    // Implement pagination logic
    console.log('Going to page:', page);
}

let selectedExperiments = new Set();

function compareExperiment(runId) {
    // Toggle experiment selection
    if (selectedExperiments.has(runId)) {
        selectedExperiments.delete(runId);
        document.querySelector(`tr[data-run-id="${runId}"]`).classList.remove('table-active');
    } else {
        selectedExperiments.add(runId);
        document.querySelector(`tr[data-run-id="${runId}"]`).classList.add('table-active');
    }
    
    // Update compare button
    const compareBtn = document.getElementById('compare-selected-btn');
    if (compareBtn) {
        compareBtn.textContent = `比较选中 (${selectedExperiments.size})`;
        compareBtn.disabled = selectedExperiments.size < 2;
    }
}

async function compareSelectedExperiments() {
    if (selectedExperiments.size < 2) {
        showAlert('请至少选择2个实验进行比较', 'warning');
        return;
    }
    
    try {
        const response = await fetch('/api/experiments/compare', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ run_ids: Array.from(selectedExperiments) })
        });
        
        const comparison = await response.json();
        
        if (response.ok) {
            showComparisonModal(comparison);
        } else {
            showAlert(`比较失败: ${comparison.error}`, 'danger');
        }
    } catch (error) {
        console.error('Failed to compare experiments:', error);
        showAlert('比较实验失败', 'danger');
    }
}

function showComparisonModal(comparison) {
    const modalHtml = `
        <div class="modal fade" id="comparisonModal" tabindex="-1">
            <div class="modal-dialog modal-xl">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">实验比较</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        ${formatComparisonTable(comparison)}
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                        <button type="button" class="btn btn-primary" onclick="exportComparison()">导出结果</button>
                    </div>
                </div>
            </div>
        </div>
    `;
    
    // Remove existing modal
    const existingModal = document.getElementById('comparisonModal');
    if (existingModal) {
        existingModal.remove();
    }
    
    // Add new modal
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    
    // Show modal
    const modal = new bootstrap.Modal(document.getElementById('comparisonModal'));
    modal.show();
}

function formatComparisonTable(comparison) {
    let html = '<div class="table-responsive">';
    
    // Metrics comparison
    if (Object.keys(comparison.metrics_comparison).length > 0) {
        html += '<h6>指标对比</h6>';
        html += '<table class="table table-striped">';
        html += '<thead><tr><th>指标</th>';
        
        comparison.experiments.forEach(exp => {
            html += `<th>${exp.run_name || exp.run_id.substring(0, 8)}</th>`;
        });
        
        html += '</tr></thead><tbody>';
        
        Object.entries(comparison.metrics_comparison).forEach(([metric, values]) => {
            html += '<tr>';
            html += `<td><strong>${metric}</strong></td>`;
            
            comparison.experiments.forEach(exp => {
                const value = values[exp.run_id];
                html += `<td>${value !== null ? (typeof value === 'number' ? value.toFixed(4) : value) : 'N/A'}</td>`;
            });
            
            html += '</tr>';
        });
        
        html += '</tbody></table>';
    }
    
    html += '</div>';
    return html;
}

async function deleteExperiment(runId) {
    if (confirm('确定要删除这个实验吗？此操作不可撤销。')) {
        try {
            const response = await fetch(`/api/experiments/${runId}`, {
                method: 'DELETE'
            });
            
            const result = await response.json();
            
            if (response.ok) {
                showAlert('实验已标记为删除', 'success');
                loadExperiments();
            } else {
                showAlert(`删除失败: ${result.error}`, 'danger');
            }
        } catch (error) {
            console.error('Failed to delete experiment:', error);
            showAlert('删除实验失败', 'danger');
        }
    }
}

function exportExperimentResults() {
    // Get current experiment data from modal
    const runId = document.querySelector('#experimentModal').dataset.runId;
    if (!runId) return;
    
    const experiment = experimentsData.find(exp => exp.run_id === runId);
    if (!experiment) return;
    
    // Create export data
    const exportData = {
        run_id: experiment.run_id,
        run_name: experiment.run_name,
        status: experiment.status,
        start_time: experiment.start_time,
        end_time: experiment.end_time,
        metrics: experiment.metrics,
        params: experiment.params,
        exported_at: new Date().toISOString()
    };
    
    // Create and download file
    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `experiment_${experiment.run_id}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    
    showAlert('实验结果已导出', 'success');
}

function exportComparison() {
    // Get comparison data
    const selectedExps = Array.from(selectedExperiments).map(id => 
        experimentsData.find(exp => exp.run_id === id)
    ).filter(Boolean);
    
    const exportData = {
        experiments: selectedExps,
        comparison_date: new Date().toISOString()
    };
    
    // Create and download file
    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `experiment_comparison_${Date.now()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    
    showAlert('比较结果已导出', 'success');
}
</script>
