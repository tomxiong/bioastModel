<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FUA - 统一分析框架{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    {% block head %}{% endblock %}
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">FUA</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">仪表板</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/experiments">实验管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/models">模型管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/monitoring">系统监控</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/dataset">数据集</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/help">使用指南</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user"></i> 管理员
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">系统设置</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#">退出登录</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <main class="container-fluid py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- 页脚 -->
    <footer class="bg-light mt-5 py-3">
        <div class="container-fluid">
            <div class="row">
                <div class="col-md-6">
                    <p class="text-muted mb-0">FUA 统一分析框架 v1.0.0</p>
                </div>
                <div class="col-md-6 text-end">
                    <p class="text-muted mb-0">
                        <span id="current-time"></span> | 
                        <span id="system-status-indicator">
                            <i class="fas fa-circle text-success"></i> 系统正常
                        </span>
                    </p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    
    {% block scripts %}{% endblock %}
    
    <script>
        // 显示当前时间
        function updateCurrentTime() {
            const now = new Date();
            document.getElementById('current-time').textContent = 
                now.toLocaleString('zh-CN');
        }
        
        // 页面加载时启动
        document.addEventListener('DOMContentLoaded', function() {
            updateCurrentTime();
            setInterval(updateCurrentTime, 1000);
            
            // 检查系统状态
            checkSystemStatus();
            setInterval(checkSystemStatus, 30000);
        });
        
        // 检查系统状态
        function checkSystemStatus() {
            fetch('/api/status')
                .then(response => response.json())
                .then(data => {
                    const indicator = document.getElementById('system-status-indicator');
                    const allServicesRunning = Object.values(data.services).every(v => v);
                    
                    if (allServicesRunning) {
                        indicator.innerHTML = '<i class="fas fa-circle text-success"></i> 系统正常';
                    } else {
                        indicator.innerHTML = '<i class="fas fa-circle text-warning"></i> 部分服务异常';
                    }
                })
                .catch(error => {
                    console.error('Failed to check system status:', error);
                    document.getElementById('system-status-indicator').innerHTML = 
                        '<i class="fas fa-circle text-danger"></i> 连接失败';
                });
        }
        
        // 显示通知
        function showNotification(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast align-items-center text-white bg-${type} border-0`;
            toast.setAttribute('role', 'alert');
            toast.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">
                        ${message}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            `;
            
            // 添加到页面
            const container = document.createElement('div');
            container.className = 'toast-container position-fixed bottom-0 end-0 p-3';
            container.appendChild(toast);
            document.body.appendChild(container);
            
            // 显示并自动隐藏
            const bsToast = new bootstrap.Toast(toast);
            bsToast.show();
            
            // 3秒后移除
            setTimeout(() => {
                container.remove();
            }, 3000);
        }
    </script>
</body>
</html>
